<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - FashionStore</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <a th:href="@{/}" class="logo">FashionStore</a>
    <h2>Đăng nhập</h2>

    <div class="alert alert-error" th:if="${param.error}">Email hoặc mật khẩu không đúng, hoặc tài khoản bị khóa.</div>
    <div class="alert alert-success" th:if="${param.logout}">Bạn đã đăng xuất.</div>
    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>

    <form th:action="@{/login}" method="post">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>

        <label for="password">Mật khẩu</label>
        <div class="pw-box">
            <input type="password" id="password" name="password" required>
            <button type="button" class="toggle-pw" data-target="password">Hiện</button>
        </div>

        <button type="submit" class="btn btn-block">Đăng nhập</button>
    </form>

    <p class="switch">Chưa có tài khoản? <a th:href="@{/register}">Đăng ký</a></p>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
