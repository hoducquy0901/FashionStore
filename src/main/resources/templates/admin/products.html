<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý sản phẩm - Quản trị</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/header :: navbar}"></header>
<div th:replace="~{fragments/admin-nav :: nav('products')}"></div>
<main class="container admin-products">
    <div class="flash flash-ok" th:if="${adminMessage}" th:text="${adminMessage}"></div>
    <div class="flash flash-err" th:if="${adminError}" th:text="${adminError}"></div>

    <div class="page-head">
        <div>
            <h1 class="section-title">Quản lý sản phẩm</h1>
            <p class="muted">Quản lý thông tin, biến thể và hình ảnh.</p>
        </div>
        <a class="btn" th:href="@{/admin/products/new}">+ Thêm sản phẩm</a>
    </div>

    <form class="search-form admin-product-filter" th:action="@{/admin/products}" method="get">
        <input type="search" name="keyword" th:value="${keyword}" placeholder="Tìm tên hoặc thương hiệu">
        <select name="status" aria-label="Lọc theo trạng thái">
            <option value="">Tất cả trạng thái</option>
            <option th:each="entry : ${statuses}" th:value="${entry.key}" th:text="${entry.value}"
                    th:selected="${status == entry.key}"></option>
        </select>
        <button class="btn" type="submit">Lọc sản phẩm</button>
    </form>

    <p class="empty" th:if="${products.isEmpty()}">Không tìm thấy sản phẩm phù hợp.</p>
    <div class="table-wrap" th:unless="${products.isEmpty()}">
        <table class="cart-table admin-product-table">
            <thead>
            <tr><th>Sản phẩm</th><th>Danh mục</th><th>Giá cơ bản</th><th>Biến thể</th><th>Trạng thái</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="product : ${products}">
                <td>
                    <div class="admin-product-cell">
                        <img th:if="${product.mainImageUrl != null}" th:src="${product.mainImageUrl}"
                             th:alt="${product.productName}">
                        <div th:unless="${product.mainImageUrl != null}" class="admin-product-placeholder">Ảnh</div>
                        <div><strong th:text="${product.productName}">Tên sản phẩm</strong>
                            <small th:text="${product.brand ?: 'Chưa có thương hiệu'}">Thương hiệu</small></div>
                    </div>
                </td>
                <td th:text="${product.categoryName}">Danh mục</td>
                <td class="line-total" th:text="${#numbers.formatDecimal(product.basePrice, 1, 'POINT', 0, 'COMMA')} + ' ₫'">0 ₫</td>
                <td th:text="${product.variantCount}">0</td>
                <td><span class="product-status" th:classappend="${'status-' + #strings.toLowerCase(product.status)}"
                          th:text="${statuses.get(product.status)}">Đang bán</span></td>
                <td><a class="btn btn-small" th:href="@{/admin/products/{id}(id=${product.productId})}">Quản lý</a></td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav class="pager" aria-label="Phân trang" th:if="${productPage.totalPages > 1}">
        <a th:each="i : ${#numbers.sequence(0, productPage.totalPages - 1)}"
           th:href="@{/admin/products(keyword=${keyword},status=${status},page=${i})}"
           th:text="${i + 1}" th:classappend="${i == productPage.number} ? 'active'"></a>
    </nav>
</main>
<footer class="footer">© 2026 FashionStore</footer>
</body>
</html>
