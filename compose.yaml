services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$${MSSQL_SA_PASSWORD}" -C -b -Q 'SELECT 1' || exit 1
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - ./scriptSQL.sql:/init/scriptSQL.sql:ro
      - ./database/order-troubleshooting-status.sql:/init/order-troubleshooting-status.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        initialized=$$(/opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -h -1 -W -Q "SET NOCOUNT ON; SELECT CASE WHEN OBJECT_ID(N'FashionStoreDB.dbo.DockerInitComplete', N'U') IS NULL THEN 0 ELSE 1 END")
        if [ "$$initialized" != "1" ]; then
          /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -i /init/scriptSQL.sql
          /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -d FashionStoreDB -Q "CREATE TABLE dbo.DockerInitComplete (InitializedAt datetime2 NOT NULL DEFAULT SYSUTCDATETIME())"
        fi
        /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -d FashionStoreDB -i /init/order-troubleshooting-status.sql

  app:
    build: .
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      PRODUCT_IMAGE_DIR: /app/uploads
      APP_ORDER_PDF_DIR: /app/order-pdfs
      SPRING_DATASOURCE_URL: jdbc:sqlserver://db:1433;databaseName=FashionStoreDB;encrypt=true;trustServerCertificate=true
    volumes:
      - product_uploads:/app/uploads
      - ./src/main/resources/static/images/orders:/app/order-pdfs
    ports:
      - "8080:8080"

volumes:
  sqlserver_data:
  product_uploads:
